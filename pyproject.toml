[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-vite-rolling"
description = "Lean Django + Vite integration with rolling-deploy-safe manifest caching."
readme = "README.md"
authors = [{ name = "Wedgworth's, Inc.", email = "engineering@wedgworth.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "vite", "manifest", "rolling-deploy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "django-redis>=5.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wedgworth/django-vite-rolling"
Issues = "https://github.com/wedgworth/django-vite-rolling/issues"
Source = "https://github.com/wedgworth/django-vite-rolling"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-django>=4",
    "fakeredis>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
